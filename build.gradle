plugins {
    id 'java'
    id 'application'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

ext {
    gdxVersion = '1.13.1'
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.github.kwhat:jnativehook:2.2.2"
    testImplementation "junit:junit:4.13.2"
}

application {
    mainClass = 'com.deskcat.DesktopLauncher'
    // small heap + serial GC: the app state is tiny, textures live on the GPU
    applicationDefaultJvmArgs = [
            '-Xms16m', '-Xmx48m',
            '-XX:MaxMetaspaceSize=64m',
            '-XX:+UseSerialGC',
    ]
}

test {
    useJUnit()
}

// double-clickable everything-included jar: java -jar deskcat.jar [skin] [name]
task fatJar(type: Jar) {
    archiveBaseName = 'deskcat'
    manifest {
        attributes 'Main-Class': 'com.deskcat.DesktopLauncher'
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
